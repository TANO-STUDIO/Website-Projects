<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Psychedelics | Product Details</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #08101f;
        --surface: rgba(15, 23, 42, 0.96);
        --surface-2: rgba(31, 41, 55, 0.9);
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #7c3aed;
        --accent-2: #22c55e;
        --border: rgba(148, 163, 184, 0.18);
        --shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: 'Inter', sans-serif;
        background: linear-gradient(135deg, #0b1522 0%, var(--bg) 100%);
        color: var(--text);
      }

      a { text-decoration: none; }
      button, input { font: inherit; }

      .page-shell {
        max-width: 1180px;
        margin: 0 auto;
        padding: 24px;
      }

      .nav {
      padding: 12px 24px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.18);
      position: sticky;
      top: 0;
      z-index: 999;
      background: var(--bg);
      backdrop-filter: saturate(180%) blur(18px);
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
      }

      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        color: var(--text);
      }

      .brand-logo {
        height: 32px;
        width: auto;
        display: inline-block;
        object-fit: contain;
      }

      .nav-links {

        display: flex;
        gap: 16px;
        align-items: center;
      }      .nav-links a {
        color: var(--muted);
        font-weight: 600;
        transition: color 180ms ease, background-color 180ms ease, transform 180ms ease, box-shadow 180ms ease;
      }

      .nav-links a:hover {
        color: white;
        background: rgba(124, 58, 237, 0.18);
        transform: translateY(-1px);
        box-shadow: 0 10px 24px rgba(124, 58, 237, 0.18);
        border-radius: 999px;
      }

      .nav-links .btn {
        padding: 10px 14px;
        border-radius: 999px;
        background: var(--accent);
        color: white;
      }

      .product-card {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 28px;
        padding: 24px;
        box-shadow: var(--shadow);
      }

      .product-visual {
        background: linear-gradient(135deg, rgba(124, 58, 237, 0.18) 0%, rgba(34, 197, 94, 0.1) 100%);
        border-radius: 24px;
        min-height: 360px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 5rem;
      }

      .product-info h1 { margin: 0 0 8px; font-size: 2rem; }
      .product-info .category {
        display: inline-block;
        margin-bottom: 10px;
        color: var(--accent);
        font-weight: 700;
      }

      .product-info .price {
        font-size: 1.6rem;
        font-weight: 700;
        color: var(--accent);
        margin: 12px 0;
      }

      .product-info p { color: var(--muted); line-height: 1.7; }

      .actions {
        display: flex;
        gap: 12px;
        margin-top: 18px;
        flex-wrap: wrap;
      }

      .btn {
        border: 0;
        border-radius: 999px;
        padding: 12px 16px;
        cursor: pointer;
        font-weight: 700;
      }

      .btn-primary {
        background: var(--accent);
        color: white;
      }

      .btn-secondary {
        background: var(--surface-2);
        color: var(--accent);
      }

      .details-list {
        margin-top: 24px;
        display: grid;
        gap: 10px;
      }

      .details-list div {
        padding: 12px 14px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--border);
      }

      @media (max-width: 900px) {
        .product-card { grid-template-columns: 1fr; }
      }

      @media (max-width: 620px) {
        .page-shell { padding: 14px; }
        .nav {
      position: sticky;
      top: 0;
      z-index: 999;
      background: var(--bg);
      backdrop-filter: saturate(180%) blur(18px); flex-direction: column; align-items: flex-start; gap: 8px; }
      }
          .menu-toggle {
        display: none;
        border: 0;
        background: transparent;
        font-size: 1.6rem;
        color: var(--text);
        cursor: pointer;
      }

      .nav-links.open {
        display: flex;
      }

      @media (max-width: 900px) {
        .menu-toggle {
          display: inline-flex;
        }

        .nav-links {
          display: none;
          flex-direction: column;
          width: 100%;
          gap: 12px;
          margin-top: 12px;
        }

        .nav-links.open {
          display: flex;
        }

        .nav-links a,
        .nav-links .btn,
        .nav-links .cart-link {
          width: 100%;
          text-align: center;
        }

        .cart-link {
          justify-content: center;
        }
      }
</style>
  </head>
  <body>
    <div class="page-shell">
      <nav class="nav">
        <a class="brand" href="home.html"><img src="logo/psychedelic logo1.jpeg" alt="Psychedelics logo" class="brand-logo" />Psychedelics</a>
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation">☰</button>
        <div class="nav-links" id="navLinks">
          <a href="home.html">Home</a>
          <a href="products.html">Shop</a>
          <a href="about.html">About</a>
          <a href="contact.html">Contact</a>
          <a class="btn" href="products.html">Back to catalog</a>
        </div>
      </nav>

      <section class="product-card">
        <div class="product-visual" id="productVisual">📦</div>
        <div class="product-info">
          <span class="category" id="productCategory">Category</span>
          <h1 id="productName">Product Name</h1>
          <div class="price" id="productPrice">$0.00</div>
          <p id="productDescription">Product description appears here.</p>
          <div class="actions">
            <button class="btn btn-primary" id="addToCartBtn">Add to cart</button>
            <a class="btn btn-secondary" href="products.html">Continue shopping</a>
          </div>

          <div class="details-list">
            <div>Discreet shipping and packaging</div>
            <div>Carefully curated, quality-checked formulas</div>
            <div>Secure checkout with privacy support</div>
          </div>
        </div>
      </section>
    </div>

    <script>
            const products = [
              { id: 'psydel01', name: 'Psilocybin Cubensis', category: 'Fungi', price: 200, image: 'product images/image a1.jpeg', description: 'Research suggests that psilocybin may help support mental well-being by promoting emotional insight, psychological flexibility, and positive mood changes when used in professionally supervised therapeutic settings.', emoji: '🍄' },
              { id: 'psydel02', name: 'Liberty Caps', category: 'Fungi', price: 200, image: 'product images/image a2.jpeg', description: 'Liberty Caps are being researched for potential reduction of depression, anxiety, and PTSD symptoms when used in professionally supervised therapeutic settings.', emoji: '🍄' },
              { id: 'psydel03', name: 'Blue Meanies', category: 'Fungi', price: 200, image: 'product images/image a3.jpeg', description: 'These shrooms have different hallucinogenic properties but similar health-supporting benefits when used with a professional guide.', emoji: '🍄' },
              { id: 'psydel04', name: 'Psilocybe Mexicana', category: 'Fungi', price: 200, image: 'product images/image a4.jpeg', description: 'Traditionally used in ceremonial settings, Psilocybe mexicana is studied for its potential to support emotional well-being under professional supervision.', emoji: '🍄' },
              { id: 'psydel05', name: 'Penis Envy', category: 'Fungi', price: 200, image: 'product images/image a5.jpeg', description: 'A potent psilocybin mushroom being researched for potential support in treating depression, anxiety, and PTSD.', emoji: '🍄' },
              { id: 'psydel06', name: 'Golden Teachers', category: 'Fungi', price: 200, image: 'product images/image a6.jpeg', description: 'Golden Teacher is studied for its potential to support treatment-resistant depression, anxiety, and other mental health issues under proper supervision.', emoji: '🍄' },
              { id: 'psydel07', name: 'Golden Cap', category: 'Fungi', price: 200, image: 'product images/image a7.jpeg', description: 'May support recovery from certain substance use disorders, depression and PTSD by promoting emotional processing and psychological flexibility.', emoji: '🍄' },
              { id: 'psydel08', name: 'Chocolate Bars', category: 'Edibles', price: 50, image: 'product images/image a8.jpeg', description: '3.5g for $50. 12 pieces per chocolate. A discreet edible option for gentle support and ceremonial-style consumption.', emoji: '🍫' },
            { id: 'psydel09', name: 'LSD SHEETS 🧩', category: 'Psychedelics', price: 150, image: 'product images/image 9.jpeg', description: 'Clinical research shows that LSD possesses significant therapeutic potential for treating mental health conditions when administered in controlled, medical settings.', emoji: '🧩', altLabel: 'A sheet of 100 tabs, 150ug at $150' },
            { id: 'psydel10', name: 'LIQUID LSD', category: 'Psychedelics', price: 150, image: 'product images/image 10.jpeg', description: 'A liquid extract designed for consistent dosing and discreet therapeutic use.', emoji: '💧', altLabel: '15ml $150' },
            { id: 'psydel11', name: 'MICRODOSE PILLS 💊🍄', category: 'Psychedelics', price: 8, image: 'product images/image 11.jpeg', description: 'Microdose pills for gentle daily support and improved focus in controlled microdosing routines.', emoji: '💊', altLabel: '$8 a pill' },
            { id: 'psydel12', name: 'DMT', category: 'Psychedelics', price: 60, image: 'product images/image 12.jpeg', description: 'DMT shows potential health benefits for treatment-resistant depression, anxiety disorders, and PTSD, primarily when administered as a psychedelic-assisted therapy in supervised clinical settings.', emoji: '✨', altLabel: 'One gram $60' },
            { id: 'psydel13', name: 'DMT VAPE CARTS', category: 'Psychedelics', price: 180, image: 'product images/image 13.jpeg', description: 'High-quality DMT vape carts for discreet, controlled use in appropriate settings.', emoji: '🌀', altLabel: '5 vapes $180' },
            { id: 'psydel14', name: 'MDMA', category: 'Psychedelics', price: 100, image: 'product images/image 14.jpeg', description: 'MDMA helps in treating post-traumatic stress disorder (PTSD), reducing fear and improving empathy during talk therapy.', emoji: '💖', altLabel: '1 gram $100' },
            { id: 'psydel15', name: 'KETAMIN POWDER', category: 'Psychedelics', price: 160, image: 'product images/image 15.jpeg', description: 'Ketamine provides rapid relief for treatment-resistant depression, reduces suicidal thoughts within hours, manages chronic pain, and promotes brain neuroplasticity.', emoji: '⚗️', altLabel: '7gms $160' },
            { id: 'psydel16', name: 'LIQUID KETAMIN', category: 'Psychedelics', price: 200, image: 'product images/image 16.jpeg', description: 'Liquid ketamine formulated for controlled therapeutic applications and easy dosing.', emoji: '💧', altLabel: '5 Vails $200' },
            { id: 'psydel17', name: 'Mescaline / Peyote🌵', category: 'Psychedelics', price: 90, image: 'product images/image 17.jpeg', description: 'Peyote is being researched for its potential to support mental health by helping with depression, anxiety, emotional healing, psychological well-being, and certain substance use disorders when used in professionally supervised therapeutic settings.', emoji: '🌵', altLabel: '2-3cm $90' }
            ];

      const params = new URLSearchParams(window.location.search);
      const productId = params.get('id');
      const product = products.find((item) => item.id === productId);

      const productVisual = document.getElementById('productVisual');
      const productCategory = document.getElementById('productCategory');
      const productName = document.getElementById('productName');
      const productPrice = document.getElementById('productPrice');
      const productDescription = document.getElementById('productDescription');
      const addToCartBtn = document.getElementById('addToCartBtn');

      if (!product) {
        productName.textContent = 'Product not found';
        productCategory.textContent = 'Unavailable';
        productPrice.textContent = '$0.00';
        productDescription.textContent = 'The requested product could not be found.';
        productVisual.textContent = '😕';
        addToCartBtn.style.display = 'none';
      } else {
        if (product.image) {
          productVisual.innerHTML = `<img src="${product.image}" alt="${product.name}" style="width:100%; height:100%; object-fit:cover; border-radius:16px;">`;
        } else {
          productVisual.textContent = product.emoji;
        }
        productCategory.textContent = product.category;
        productName.textContent = product.name;
        productPrice.textContent = product.altLabel ? product.altLabel : `$${product.price.toFixed(2)}`;
        productDescription.textContent = product.description;

        addToCartBtn.addEventListener('click', () => {
          const cart = JSON.parse(localStorage.getItem('psychedelics-cart') || '[]');
          // default to 3.5g packs on detail page
          const unit = 'g';
          const unitSize = 3.5;
          let perUnitPrice;
          if (product.altLabel) {
            perUnitPrice = product.price;
          } else {
            const perGram = product.price / 28.35;
            perUnitPrice = parseFloat((perGram * unitSize).toFixed(2));
          }

          const existingItem = cart.find((item) => item.id === product.id && item.unit === unit && String(item.unitSize || '') === String(unitSize));

          if (existingItem) {
            existingItem.quantity += 1;
          } else {
            cart.push({ id: product.id, name: product.name, image: product.image, quantity: 1, price: perUnitPrice, unit: unit, unitSize: unitSize });
          }

          localStorage.setItem('psychedelics-cart', JSON.stringify(cart));
          alert(`${product.name} added to cart.`);
        });
      }
    </script>
      <script>
      const menuToggle = document.getElementById('menuToggle');
      const navLinks = document.getElementById('navLinks');

      if (menuToggle && navLinks) {
        menuToggle.addEventListener('click', () => {
          const expanded = navLinks.classList.toggle('open');
          menuToggle.textContent = expanded ? '✕' : '☰';
          menuToggle.setAttribute('aria-label', expanded ? 'Close navigation' : 'Open navigation');
        });
      }
    </script>
</body>
</html>
