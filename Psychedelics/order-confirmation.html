<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Psychedelics | Order Confirmation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #08101f;
        --surface: rgba(15, 23, 42, 0.96);
        --surface-2: rgba(31, 41, 55, 0.9);
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #7c3aed;
        --accent-2: #22c55e;
        --border: rgba(148, 163, 184, 0.18);
        --shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: 'Inter', sans-serif;
        background: linear-gradient(135deg, #0b1522 0%, var(--bg) 100%);
        color: var(--text);
      }
      a { text-decoration: none; }

      .page-shell {
        max-width: 900px;
        margin: 0 auto;
        padding: 24px;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 28px;
        box-shadow: var(--shadow);
        padding: 32px;
        text-align: center;
      }

      .checkmark {
        width: 84px;
        height: 84px;
        margin: 0 auto 16px;
        border-radius: 50%;
        background: linear-gradient(90deg, var(--accent) 0%, var(--accent-2) 100%);
        color: white;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
      }

      h1 { margin: 0 0 10px; font-size: 2rem; }
      p { color: var(--muted); line-height: 1.7; }

      .summary {
        margin-top: 20px;
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 16px;
        text-align: left;
      }

      .summary-row {
        display: flex;
        justify-content: space-between;
        padding: 8px 0;
        border-bottom: 1px solid var(--border);
      }

      .summary-row:last-child { border-bottom: 0; }

      .actions {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-top: 22px;
        flex-wrap: wrap;
      }

      .btn {
        padding: 12px 16px;
        border-radius: 999px;
        font-weight: 700;
      }

      .btn-primary {
        background: var(--accent);
        color: white;
      }

      .btn-secondary {
        background: var(--surface-2);
        color: var(--accent);
      }

      @media (max-width: 620px) {
        .page-shell { padding: 14px; }
        .card { padding: 24px; }
      }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <div class="card">
        <div class="checkmark">✓</div>
        <h1>Order confirmed!</h1>
        <p>Your order has been placed successfully. A confirmation email will be sent soon with your receipt and delivery details.</p>

        <div class="summary">
          <div class="summary-row"><span>Order number</span><strong>#NTH-1042</strong></div>
          <div class="summary-row"><span>Estimated delivery</span><strong>3–5 business days</strong></div>
          <div class="summary-row"><span>Payment</span><strong>Card</strong></div>
        </div>

        <div class="actions">
          <a class="btn btn-primary" href="home.html">Back to home</a>
          <a class="btn btn-secondary" href="products.html">Continue shopping</a>
        </div>
      </div>
    </div>
  </body>
</html>
