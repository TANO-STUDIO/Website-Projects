<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Psychedelics | Checkout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #08101f;
        --surface: rgba(15, 23, 42, 0.96);
        --surface-2: rgba(31, 41, 55, 0.9);
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #7c3aed;
        --accent-2: #22c55e;
        --border: rgba(148, 163, 184, 0.18);
        --shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: 'Inter', sans-serif;
        background: linear-gradient(135deg, #0b1522 0%, var(--bg) 100%);
        color: var(--text);
      }

      a { text-decoration: none; }
      button, input, select { font: inherit; }

      .page-shell {
        max-width: 1180px;
        margin: 0 auto;
        padding: 24px;
      }

      .nav {
      padding: 12px 24px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.18);
      position: sticky;
      top: 0;
      z-index: 999;
      background: var(--bg);
      backdrop-filter: saturate(180%) blur(18px);
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        color: var(--text);
      }

      .brand-logo {
        height: 32px;
        width: auto;
        display: inline-block;
        object-fit: contain;
      }

      .nav-links {

        display: flex;
        gap: 16px;
        align-items: center;
      }      .nav-links a {
        color: var(--muted);
        font-weight: 600;
        transition: color 180ms ease, background-color 180ms ease, transform 180ms ease, box-shadow 180ms ease;
      }

      .nav-links a:hover {
        color: white;
        background: rgba(124, 58, 237, 0.18);
        transform: translateY(-1px);
        box-shadow: 0 10px 24px rgba(124, 58, 237, 0.18);
        border-radius: 999px;
      }

      .nav-links .btn {
        padding: 10px 14px;
        border-radius: 999px;
        background: var(--accent);
        color: white;
      }

      .checkout-grid {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 24px;
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 24px;
        box-shadow: var(--shadow);
        padding: 24px;
      }

      .panel h2 { margin: 0 0 8px; }
      .panel p { margin: 0 0 16px; color: var(--muted); }

      .field-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
      .field.full { grid-column: 1 / -1; }
      .field label { font-size: 0.95rem; font-weight: 600; }
      .field input, .field select {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px 14px;
        background: rgba(255, 255, 255, 0.06);
      }

      .summary-card { display: flex; flex-direction: column; gap: 12px; }
      .summary-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 10px 0;
        border-bottom: 1px solid var(--border);
      }

      .summary-total {
        display: flex;
        justify-content: space-between;
        padding-top: 8px;
        font-weight: 700;
        font-size: 1.05rem;
      }

      .checkout-btn {
        margin-top: 10px;
        width: 100%;
        border: 0;
        border-radius: 14px;
        padding: 13px;
        background: linear-gradient(90deg, var(--accent) 0%, var(--accent-2) 100%);
        color: white;
        font-weight: 700;
        cursor: pointer;
      }

      .empty-state {
        padding: 18px;
        border: 1px dashed var(--border);
        border-radius: 14px;
        color: var(--muted);
      }

      @media (max-width: 900px) {
        .checkout-grid { grid-template-columns: 1fr; }
      }

      @media (max-width: 620px) {
        .page-shell { padding: 14px; }
        .nav {
      position: sticky;
      top: 0;
      z-index: 999;
      background: var(--bg);
      backdrop-filter: saturate(180%) blur(18px); flex-direction: column; align-items: flex-start; gap: 8px; }
        .field-grid { grid-template-columns: 1fr; }
      }
          .menu-toggle {
        display: none;
        border: 0;
        background: transparent;
        font-size: 1.6rem;
        color: var(--text);
        cursor: pointer;
      }

      .nav-links.open {
        display: flex;
      }

      @media (max-width: 900px) {
        .menu-toggle {
          display: inline-flex;
        }

        .nav-links {
          display: none;
          flex-direction: column;
          width: 100%;
          gap: 12px;
          margin-top: 12px;
        }

        .nav-links.open {
          display: flex;
        }

        .nav-links a,
        .nav-links .btn,
        .nav-links .cart-link {
          width: 100%;
          text-align: center;
        }

        .cart-link {
          justify-content: center;
        }
      }
</style>
  </head>
  <body>
    <div class="page-shell">
      <nav class="nav">
        <a class="brand" href="home.html"><img src="logo/psychedelic logo1.jpeg" alt="Psychedelics logo" class="brand-logo" />Psychedelics</a>
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation">☰</button>
        <div class="nav-links" id="navLinks">
          <a href="home.html">Home</a>
          <a href="products.html">Shop</a>
          <a href="about.html">About</a>
          <a href="contact.html">Contact</a>
          <a href="admin.html">Admin</a>
          <a class="btn" href="cart.html">Back to cart</a>
        </div>
      </nav>

      <div class="checkout-grid">
        <section class="panel">
          <h2>Shipping details</h2>
          <p>Fill in your information to complete your order securely.</p>
          <form id="checkoutForm">
            <div class="field-grid">
              <div class="field">
                <label for="firstName">First name</label>
                <input id="firstName" name="firstName" required />
              </div>
              <div class="field">
                <label for="lastName">Last name</label>
                <input id="lastName" name="lastName" required />
              </div>
              <div class="field full">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" required />
              </div>
              <div class="field full">
                <label for="address">Address</label>
                <input id="address" name="address" required />
              </div>
              <div class="field">
                <label for="city">City</label>
                <input id="city" name="city" required />
              </div>
              <div class="field">
                <label for="zip">Postal code</label>
                <input id="zip" name="zip" required />
              </div>
              <div class="field full">
                <label for="payment">Payment method</label>
                <select id="payment" name="payment">
                  <option>Card</option>
                  <option>PayPal</option>
                  <option>Bank transfer</option>
                </select>
              </div>
            </div>
            <button class="checkout-btn" type="submit">Place order</button>
          </form>
        </section>

        <aside class="panel">
          <h2>Order summary</h2>
          <p>Review your selected items before checkout.</p>
          <div id="summaryItems" class="summary-card"></div>
        </aside>
      </div>
    </div>

    <script>
      const cart = JSON.parse(localStorage.getItem('psychedelics-cart') || '[]');
      const summaryItems = document.getElementById('summaryItems');
      const checkoutForm = document.getElementById('checkoutForm');

      function formatCurrency(value) {
        return `$${value.toFixed(2)}`;
      }

      function renderSummary() {
        if (cart.length === 0) {
          summaryItems.innerHTML = '<div class="empty-state">Your cart is empty. Return to the shop to add items.</div>';
          return;
        }

        const total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);

        summaryItems.innerHTML = '';

        cart.forEach((item) => {
          const row = document.createElement('div');
          row.className = 'summary-item';
          row.innerHTML = `
            <span>${item.name} × ${item.quantity}</span>
            <strong>${formatCurrency(item.price * item.quantity)}</strong>
          `;
          summaryItems.appendChild(row);
        });

        const totalRow = document.createElement('div');
        totalRow.className = 'summary-total';
        totalRow.innerHTML = `
          <span>Total</span>
          <span>${formatCurrency(total)}</span>
        `;
        summaryItems.appendChild(totalRow);
      }

      checkoutForm.addEventListener('submit', (event) => {
        event.preventDefault();

        const formData = new FormData(checkoutForm);
        const firstName = formData.get('firstName')?.toString().trim() || 'Guest';
        const lastName = formData.get('lastName')?.toString().trim() || '';
        const email = formData.get('email')?.toString().trim() || 'unknown@example.com';
        const customerName = [firstName, lastName].filter(Boolean).join(' ');
        const customerItems = cart.map((item) => `${item.name} × ${item.quantity}`);
        const total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);

        const existingOrders = JSON.parse(localStorage.getItem('psychedelics-admin-orders') || '[]');
        const newOrder = {
          id: `ord-${Date.now()}`,
          customer: customerName || 'Guest Customer',
          email,
          total,
          status: 'Pending',
          createdAt: new Date().toISOString().slice(0, 10),
          items: customerItems
        };

        localStorage.setItem('psychedelics-admin-orders', JSON.stringify([...existingOrders, newOrder]));
        localStorage.removeItem('psychedelics-cart');
        window.location.href = 'order-confirmation.html';
      });

      renderSummary();
    </script>
      <script>
      const menuToggle = document.getElementById('menuToggle');
      const navLinks = document.getElementById('navLinks');

      if (menuToggle && navLinks) {
        menuToggle.addEventListener('click', () => {
          const expanded = navLinks.classList.toggle('open');
          menuToggle.textContent = expanded ? '✕' : '☰';
          menuToggle.setAttribute('aria-label', expanded ? 'Close navigation' : 'Open navigation');
        });
      }
    </script>
</body>
</html>
