<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Psychedelics | Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f7fb;
        --surface: #ffffff;
        --surface-2: #eef2ff;
        --text: #132238;
        --muted: #61708a;
        --accent: #4f46e5;
        --accent-2: #7c3aed;
        --border: #e5e7eb;
        --shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
        --danger: #dc2626;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: 'Inter', sans-serif;
        background: linear-gradient(135deg, #0b1522 0%, var(--bg) 100%);
        color: var(--text);
      }

      a { text-decoration: none; }
      button, input, select, textarea { font: inherit; }

      .page-shell {
        max-width: 1320px;
        margin: 0 auto;
        padding: 24px;
      }

      .nav {
      padding: 12px 24px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.18);
      position: sticky;
      top: 0;
      z-index: 999;
      background: var(--bg);
      backdrop-filter: saturate(180%) blur(18px);
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        color: var(--text);
      }

      .brand-logo {
        height: 32px;
        width: auto;
        display: inline-block;
        object-fit: contain;
      }

      .nav-links {

        display: flex;
        gap: 16px;
        align-items: center;
      }      .nav-links a {
        color: var(--muted);
        font-weight: 600;
        transition: color 180ms ease, background-color 180ms ease, transform 180ms ease, box-shadow 180ms ease;
      }

      .nav-links a:hover {
        color: white;
        background: rgba(124, 58, 237, 0.18);
        transform: translateY(-1px);
        box-shadow: 0 10px 24px rgba(124, 58, 237, 0.18);
        border-radius: 999px;
      }

      .nav-links a.active { color: var(--accent); }
      .menu-toggle {
        display: none;
        border: 0;
        background: transparent;
        font-size: 1.4rem;
        color: var(--text);
        cursor: pointer;
      }

      .nav-links.open {
        display: flex;
      }

      @media (max-width: 900px) {
        .menu-toggle {
          display: inline-flex;
        }

        .nav-links {
          display: none;
          flex-direction: column;
          width: 100%;
          gap: 12px;
          margin-top: 12px;
        }

        .nav-links.open {
          display: flex;
        }

        .nav-links a,
        .nav-links .btn,
        .nav-links .cart-link {
          width: 100%;
        }

        .cart-link {
          justify-content: center;
        }
      }

      .nav-links .btn {
        padding: 10px 14px;
        border-radius: 999px;
        background: var(--accent);
        color: white;
      }

      .hero {
        padding: 24px 28px;
        border-radius: 24px;
        background: linear-gradient(90deg, #111827 0%, #312e81 100%);
        color: white;
        box-shadow: var(--shadow);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
      }

      .hero h1 { margin: 0 0 8px; font-size: clamp(1.6rem, 2.5vw, 2.2rem); }
      .hero p { margin: 0; color: rgba(255,255,255,0.85); }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
        margin: 18px 0 20px;
      }

      .stat-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 16px;
        box-shadow: var(--shadow);
      }

      .stat-card span {
        display: block;
        color: var(--muted);
        font-size: 0.9rem;
        margin-bottom: 8px;
      }

      .stat-card strong { font-size: 1.4rem; }

      .content-grid {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 18px;
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 24px;
        box-shadow: var(--shadow);
        padding: 20px;
      }

      .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
        gap: 10px;
      }

      .panel-header h2 { margin: 0; font-size: 1.1rem; }

      .btn, .ghost-btn {
        border: 0;
        border-radius: 999px;
        padding: 10px 14px;
        cursor: pointer;
        font-weight: 600;
      }

      .btn {
        background: linear-gradient(90deg, var(--accent) 0%, var(--accent-2) 100%);
        color: white;
      }

      .ghost-btn {
        background: rgba(148, 163, 184, 0.12);
        color: var(--text);
      }

      .product-form {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 18px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .field.full { grid-column: 1 / -1; }

      .field label {
        font-size: 0.92rem;
        font-weight: 600;
      }

      .field input,
      .field textarea,
      .field select {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 11px 12px;
        background: rgba(255, 255, 255, 0.06);
      }

      .field textarea { min-height: 90px; resize: vertical; }

      .form-actions {
        grid-column: 1 / -1;
        display: flex;
        gap: 10px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th, td {
        text-align: left;
        padding: 10px 8px;
        border-bottom: 1px solid var(--border);
        font-size: 0.95rem;
      }

      th { color: var(--muted); font-weight: 700; }

      .pill {
        display: inline-flex;
        align-items: center;
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 0.8rem;
        font-weight: 700;
        background: #eef2ff;
        color: var(--accent);
      }

      .pill.low { background: rgba(248, 113, 113, 0.12); color: var(--danger); }

      .row-actions {
        display: flex;
        gap: 8px;
      }

      .row-actions button {
        border: 0;
        border-radius: 999px;
        padding: 7px 10px;
        cursor: pointer;
        background: rgba(148, 163, 184, 0.12);
        color: var(--text);
      }

      .orders-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .order-card {
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 14px;
        background: #fcfdff;
      }

      .order-top {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: center;
        margin-bottom: 8px;
      }

      .order-top strong { font-size: 0.95rem; }

      .order-meta {
        color: var(--muted);
        font-size: 0.9rem;
        margin-bottom: 8px;
      }

      .order-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
      }

      .status-select {
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 8px 10px;
        background: var(--surface);
      }

      @media (max-width: 1000px) {
        .content-grid { grid-template-columns: 1fr; }
        .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }

      @media (max-width: 620px) {
        .page-shell { padding: 14px; }
        .nav {
      position: sticky;
      top: 0;
      z-index: 999;
      background: var(--bg);
      backdrop-filter: saturate(180%) blur(18px); flex-direction: column; align-items: flex-start; gap: 8px; }
        .hero { flex-direction: column; align-items: flex-start; }
        .stats-grid { grid-template-columns: 1fr; }
        .product-form { grid-template-columns: 1fr; }
        .form-actions { flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <nav class="nav">
        <a class="brand" href="home.html"><img src="logo/psychedelic logo1.jpeg" alt="Psychedelics logo" class="brand-logo" />Psychedelics</a>
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation">☰</button>
        <div class="nav-links" id="navLinks">
          <a href="home.html">Home</a>
          <a href="products.html">Shop</a>
          <a href="about.html">About</a>
          <a href="contact.html">Contact</a>
          <a class="active" href="admin.html">Admin</a>
          <a class="btn" href="cart.html">Cart</a>
        </div>
      </nav>

      <section class="hero">
        <div>
          <h1>Inventory control center</h1>
          <p>Manage product inventory, stock, and customer orders for the pharmacy.</p>
        </div>
        <button id="resetDemoBtn" class="ghost-btn">Reset demo data</button>
      </section>

      <div class="stats-grid">
        <div class="stat-card">
          <span>Total products</span>
          <strong id="totalProducts">0</strong>
        </div>
        <div class="stat-card">
          <span>Low stock</span>
          <strong id="lowStockCount">0</strong>
        </div>
        <div class="stat-card">
          <span>Pending orders</span>
          <strong id="pendingOrders">0</strong>
        </div>
        <div class="stat-card">
          <span>Revenue</span>
          <strong id="revenueTotal">$0.00</strong>
        </div>
      </div>

      <div class="content-grid">
        <section class="panel">
          <div class="panel-header">
            <h2>Inventory manager</h2>
            <span class="pill">Live updates</span>
          </div>

          <form id="productForm" class="product-form">
            <input id="productId" type="hidden" />
            <div class="field">
              <label for="productName">Product name</label>
              <input id="productName" required />
            </div>
            <div class="field">
              <label for="productCategory">Category</label>
              <select id="productCategory">
                <option>Accessories</option>
                <option>Microdose</option>
                <option>Therapeutics</option>
                <option>Wellness</option>
                <option>Bundles</option>
              </select>
            </div>
            <div class="field">
              <label for="productPrice">Price</label>
              <input id="productPrice" type="number" min="0" step="0.01" required />
            </div>
            <div class="field">
              <label for="productStock">Stock</label>
              <input id="productStock" type="number" min="0" step="1" required />
            </div>
            <div class="field full">
              <label for="productDescription">Description</label>
              <textarea id="productDescription" required></textarea>
            </div>
            <div class="form-actions">
              <button class="btn" type="submit">Save product</button>
              <button class="ghost-btn" type="button" id="cancelEditBtn">Cancel</button>
            </div>
          </form>

          <div style="overflow-x: auto;">
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Category</th>
                  <th>Price</th>
                  <th>Stock</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="productsTableBody"></tbody>
            </table>
          </div>
        </section>

        <section class="panel">
          <div class="panel-header">
            <h2>Customer orders</h2>
            <span class="pill">Recent activity</span>
          </div>
          <div id="ordersList" class="orders-list"></div>
        </section>
      </div>
    </div>

    <script>
            const defaultProducts = [
        {
          id: 'p1',
          name: 'Psilocybin Microdose Capsules',
          category: 'Microdose',
          price: 39,
          stock: 18,
          description: 'Balanced microdose capsules for gentle mood support.'
        },
        {
          id: 'p2',
          name: 'Sunrise Mushroom Tea Kit',
          category: 'Wellness',
          price: 29,
          stock: 14,
          description: 'A tea kit designed for grounded ritual and easy mornings.'
        },
        {
          id: 'p3',
          name: 'Dreamscape Ceremony Bundle',
          category: 'Bundles',
          price: 89,
          stock: 9,
          description: 'A curated bundle for preparation, ceremony, and calm recovery.'
        }
      ];

            const defaultOrders = [
        {
          id: 'ord-1001',
          customer: 'Mina Carter',
          email: 'mina@example.com',
          total: 107,
          status: 'Pending',
          createdAt: '2026-07-28',
          items: ['Psilocybin Microdose Capsules x2', 'Sunrise Mushroom Tea Kit x1']
        },
        {
          id: 'ord-1002',
          customer: 'Jules Ortiz',
          email: 'jules@example.com',
          total: 89,
          status: 'Shipped',
          createdAt: '2026-07-27',
          items: ['Dreamscape Ceremony Bundle x1']
        }
      ];

      const productForm = document.getElementById('productForm');
      const productIdInput = document.getElementById('productId');
      const productsTableBody = document.getElementById('productsTableBody');
      const ordersList = document.getElementById('ordersList');
      const totalProductsEl = document.getElementById('totalProducts');
      const lowStockCountEl = document.getElementById('lowStockCount');
      const pendingOrdersEl = document.getElementById('pendingOrders');
      const revenueTotalEl = document.getElementById('revenueTotal');

      function generateId() {
        return 'id-' + Math.random().toString(36).slice(2, 10);
      }

      function readStorage(key, fallback) {
        try {
          const saved = localStorage.getItem(key);
          return saved ? JSON.parse(saved) : fallback;
        } catch (error) {
          console.error(error);
          return fallback;
        }
      }

      function writeStorage(key, value) {
        localStorage.setItem(key, JSON.stringify(value));
      }

      function formatCurrency(value) {
        return `$${value.toFixed(2)}`;
      }

      let products = readStorage('psychedelics-admin-products', defaultProducts);
      let orders = readStorage('psychedelics-admin-orders', defaultOrders);

      function resetForm() {
        productForm.reset();
        productIdInput.value = '';
        document.getElementById('productName').focus();
      }

      function renderStats() {
        const lowStock = products.filter((product) => product.stock < 5).length;
        const pending = orders.filter((order) => order.status === 'Pending').length;
        const revenue = orders
          .filter((order) => order.status !== 'Cancelled')
          .reduce((sum, order) => sum + Number(order.total || 0), 0);

        totalProductsEl.textContent = products.length;
        lowStockCountEl.textContent = lowStock;
        pendingOrdersEl.textContent = pending;
        revenueTotalEl.textContent = formatCurrency(revenue);
      }

      function renderProducts() {
        if (!products.length) {
          productsTableBody.innerHTML = '<tr><td colspan="5">No products yet. Add one above.</td></tr>';
          return;
        }

        productsTableBody.innerHTML = '';

        products.forEach((product) => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>
              <strong>${product.name}</strong><br />
              <span style="color: var(--muted); font-size: 0.85rem;">${product.description}</span>
            </td>
            <td>${product.category}</td>
            <td>${formatCurrency(Number(product.price))}</td>
            <td>
              <span class="pill ${product.stock < 5 ? 'low' : ''}">${product.stock} in stock</span>
            </td>
            <td>
              <div class="row-actions">
                <button data-action="edit" data-id="${product.id}" type="button">Edit</button>
                <button data-action="delete" data-id="${product.id}" type="button">Delete</button>
              </div>
            </td>
          `;
          productsTableBody.appendChild(row);
        });
      }

      function renderOrders() {
        if (!orders.length) {
          ordersList.innerHTML = '<div class="order-card">No orders yet. Checkout activity will appear here.</div>';
          return;
        }

        ordersList.innerHTML = '';

        orders.forEach((order) => {
          const card = document.createElement('div');
          card.className = 'order-card';
          card.innerHTML = `
            <div class="order-top">
              <strong>${order.id}</strong>
              <span class="pill">${order.status}</span>
            </div>
            <div class="order-meta">${order.customer} • ${order.email}</div>
            <div class="order-meta">${order.items.join(', ')}</div>
            <div class="order-footer">
              <strong>${formatCurrency(Number(order.total || 0))}</strong>
              <select class="status-select" data-status-id="${order.id}">
                <option ${order.status === 'Pending' ? 'selected' : ''}>Pending</option>
                <option ${order.status === 'Processing' ? 'selected' : ''}>Processing</option>
                <option ${order.status === 'Shipped' ? 'selected' : ''}>Shipped</option>
                <option ${order.status === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
              </select>
            </div>
          `;
          ordersList.appendChild(card);
        });
      }

      function render() {
        renderStats();
        renderProducts();
        renderOrders();
      }

      function persistData() {
        writeStorage('psychedelics-admin-products', products);
        writeStorage('psychedelics-admin-orders', orders);
      }

      productForm.addEventListener('submit', (event) => {
        event.preventDefault();

        const data = {
          id: productIdInput.value || generateId(),
          name: document.getElementById('productName').value.trim(),
          category: document.getElementById('productCategory').value,
          price: Number(document.getElementById('productPrice').value),
          stock: Number(document.getElementById('productStock').value),
          description: document.getElementById('productDescription').value.trim()
        };

        if (!data.name || !data.description) return;

        if (productIdInput.value) {
          products = products.map((product) => (product.id === data.id ? data : product));
        } else {
          products.unshift(data);
        }

        persistData();
        render();
        resetForm();
      });

      document.getElementById('cancelEditBtn').addEventListener('click', resetForm);

      productsTableBody.addEventListener('click', (event) => {
        const button = event.target.closest('button[data-action]');
        if (!button) return;

        const { action, id } = button.dataset;

        if (action === 'delete') {
          products = products.filter((product) => product.id !== id);
          persistData();
          render();
        }

        if (action === 'edit') {
          const product = products.find((item) => item.id === id);
          if (!product) return;

          productIdInput.value = product.id;
          document.getElementById('productName').value = product.name;
          document.getElementById('productCategory').value = product.category;
          document.getElementById('productPrice').value = product.price;
          document.getElementById('productStock').value = product.stock;
          document.getElementById('productDescription').value = product.description;
          document.getElementById('productName').focus();
        }
      });

      ordersList.addEventListener('change', (event) => {
        const select = event.target.closest('select[data-status-id]');
        if (!select) return;

        const orderId = select.getAttribute('data-status-id');
        orders = orders.map((order) =>
          order.id === orderId ? { ...order, status: select.value } : order
        );
        persistData();
        render();
      });

      document.getElementById('resetDemoBtn').addEventListener('click', () => {
        products = defaultProducts.map((product) => ({ ...product }));
        orders = defaultOrders.map((order) => ({ ...order }));
        persistData();
        render();
        resetForm();
      });

      render();
    </script>
      <script>
      const menuToggle = document.getElementById('menuToggle');
      const navLinks = document.getElementById('navLinks');

      if (menuToggle && navLinks) {
        menuToggle.addEventListener('click', () => {
          const expanded = navLinks.classList.toggle('open');
          menuToggle.textContent = expanded ? '✕' : '☰';
          menuToggle.setAttribute('aria-label', expanded ? 'Close navigation' : 'Open navigation');
        });
      }
    </script>
</body>
</html>
